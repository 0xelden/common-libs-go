name: CI

on:
  push:
    branches: [ dev, qa, main ]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          go build \
            -ldflags=" \
              -X 'github.com/0xelden/common-libs-go/cli.Commit=${GITHUB_SHA::7}' \
              -X 'github.com/0xelden/common-libs-go/cli.Created=$(date -R)' \
              -X 'github.com/0xelden/common-libs-go/cli.Build=$(uname -nmr)' \
              -X 'github.com/0xelden/common-libs-go/cli.Version=${GITHUB_REF_NAME}' "
